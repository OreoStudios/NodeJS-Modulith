services:
  supportdesk:
    build:
      context: .
      dockerfile: examples/supportdesk/Dockerfile
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set a session secret}
      PORT: '3000'
      LOG_FILE: /app-logs/events.jsonl
    volumes:
      - supportdesk-logs:/app-logs
    ports: ['127.0.0.1:3000:3000']
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['127.0.0.1:9090:9090']
    depends_on: [supportdesk]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set Grafana password}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3001:3000']
    depends_on: [prometheus]
volumes:
  supportdesk-logs:
