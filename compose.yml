name: ojs-sentinel-x
services:
  supportdesk:
    build:
      context: .
      dockerfile: examples/supportdesk/Dockerfile
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set a random 32+ character secret in .env}
      PORT: '3000'
      LOG_FILE: /app-logs/events.jsonl
      SQLITE_PATH: /workspace/examples/supportdesk/data/supportdesk.db
      DEMO_SEED: ${DEMO_SEED:-1}
    volumes:
      - supportdesk-logs:/app-logs
      - supportdesk-db:/workspace/examples/supportdesk/data
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      supportdesk:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set Grafana password in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on: [prometheus]
volumes:
  supportdesk-logs:
    name: ojs_sentinel_x_supportdesk_logs
  supportdesk-db:
