name: OJS CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root
      - name: Framework and SupportDesk tests
        run: npm run test:all
      - name: Check JavaScript source syntax
        run: |
          find examples/supportdesk/src packages/observability/src packages/security-events/src -name '*.js' -exec node --check {} \;
